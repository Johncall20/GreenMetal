[binaries]
c = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
cpp = ['clang++', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
objc = ['clang', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
rust = ['rustc', '--target', 'x86_64-apple-darwin']
ar = 'ar'
strip = 'strip'

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
